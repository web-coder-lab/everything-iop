services:
  - type: web
    name: everything
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: CLIENT_DIST
        value: dist
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_STREAM_STORAGE_HOURS
        value: "6"
      - key: PRIVATE_API_BASE_URL
        sync: false
      - key: PRIVATE_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: PAYMENT_GATEWAY_BASE_URL
        sync: false
      - key: PAYMENT_GATEWAY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
